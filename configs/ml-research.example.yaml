# Real-data template: replace IDs/paths with your verified raw-price imports.
# For a runnable configuration without external data, run examples/ml_research_demo.py.
experiment:
  name: equity_ranking_v1
  primary_model: ridge
data:
  data_dir: ../data
  benchmark: SPY
  prediction_horizon: 5
  holdout_start: '2025-01-02'
  universe: [AAPL, MSFT, GOOG]
  snapshots:
    SPY: {snapshot_id: REPLACE_WITH_SHA256, actions: ../data/actions/SPY.json}
    AAPL: {snapshot_id: REPLACE_WITH_SHA256, actions: ../data/actions/AAPL.json}
    MSFT: {snapshot_id: REPLACE_WITH_SHA256, actions: ../data/actions/MSFT.json}
    GOOG: {snapshot_id: REPLACE_WITH_SHA256, actions: ../data/actions/GOOG.json}
features:
  return_windows: [1, 3, 5, 10, 20, 60]
  short_window: 10
  long_window: 20
  atr_window: 14
  rsi_window: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_window: 20
models:
  - {type: ridge, objective: regression, seed: 42, parameters: {alpha: 10}}
  - {type: logistic, objective: classification, seed: 42, parameters: {C: 1}}
  - {type: random_forest, seed: 42, parameters: {n_estimators: 100, max_depth: 5}}
  - {type: lightgbm, seed: 42, parameters: {n_estimators: 100, num_leaves: 15}}
  - {type: xgboost, seed: 42, parameters: {n_estimators: 100, max_depth: 3}}
validation:
  method: walk_forward
  training_sessions: 120
  validation_sessions: 30
  test_sessions: 30
  expanding: true
  embargo_sessions: 0
strategy:
  top_n: 2
  minimum_dollar_volume: 1000000
  rebalance_sessions: 5
  maximum_position_weight: 0.4
  cash_allocation: 0.2
  regime_filter: false
  minimum_market_trend: 0
execution:
  initial_cash: '100000'
  commission_per_share: '0.005'
  commission_fixed: '0'
  minimum_commission: '0'
  slippage_bps: '5'
  spread_bps: '2'
