# Review-only example. No keys, approval or broker connection are provisioned.
mode: BROKER_SANDBOX
broker: alpaca_paper
account_id: operator-must-set-exact-paper-account-id
database: ../data/execution/operator/oms.sqlite
symbols: [SPY]
approval_file: ../data/execution/operator/reviewed-approval.json
poll_seconds: 5
cancel_open_on_shutdown: true
risk:
  gross: 0.9
  net: 0.9
  leverage: 1.0
  position: 0.2
  correlated: 0.7
  strategy: 0.2
  daily_loss: 0.01
  drawdown: 0.1
  max_order_units: 10
  max_order_notional: 5000
  max_orders_per_minute: 5
  stale_seconds: 30
strategy:
  id: operator-reviewed-sandbox-test
  type: fixed_target_sandbox_test
  version: reviewed-test-v1
  symbol: SPY
  target_units: 1
  max_submissions: 1
