name: CI
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra ml --python 3.12
      - run: uv run --frozen ruff check src tests examples
      - run: uv run --frozen ruff format --check src tests examples
      - run: uv run --frozen pytest -q
      - run: uv build
